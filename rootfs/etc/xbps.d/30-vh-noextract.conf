# noextract: файл не распаковывается ни при установке, ни при обновлениях.
# SUID-программы, которые не нужны никому (docs/02):
noextract=/usr/bin/su
noextract=/usr/bin/sg
noextract=/usr/bin/newgrp
noextract=/usr/bin/chsh
noextract=/usr/bin/chfn
noextract=/usr/bin/expiry
noextract=/usr/bin/gpasswd
# newuidmap/newgidmap — отображение диапазонов subuid в user namespace (podman и т. п.).
noextract=/usr/bin/newuidmap
noextract=/usr/bin/newgidmap
# AppArmor: штатный 09-apparmor.sh компилирует все ~150 профилей пакета при каждой
# загрузке и без кэша. Вместо него — 09-vh-apparmor.sh: только нужные профили, из кэша.
noextract=/etc/runit/core-services/09-apparmor.sh
