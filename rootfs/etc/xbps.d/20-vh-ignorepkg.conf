# ignorepkg: зависимость считается удовлетворённой, пакет не ставится (man xbps.d).
# Пакет apparmor тянет python-модули для графических утилит (aa-notify и др.).
# Парсер профилей (apparmor_parser) и aa-status написаны на C и в них не нуждаются.
ignorepkg=python3-tkinter
ignorepkg=python3-gobject
ignorepkg=python3-dbus
ignorepkg=python3-notify2
ignorepkg=python3-psutil
# Сам python3 (apparmor и nftables объявляют его ради своих Python-обвязок) не ставится:
# интерпретатор с ctypes создаёт исполняемую память и обходит noexec на /home и /tmp.
# Инструменты системы написаны на C (src/), python3 им не нужен (docs/05).
ignorepkg=python3
# iwd и wireguard-tools тянут openresolv; resolv.conf у нас статический (127.0.0.1).
ignorepkg=openresolv
# Никогда не ставим sudo: администрирование — через opendoas.
ignorepkg=sudo
