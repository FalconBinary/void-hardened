# void-hardened: DHCP только для проводной сети (docs/06).
allowinterfaces eth0
ipv4only
noipv6rs
# DNS, NTP и имя хоста из DHCP не принимаем: резолвер — unbound, время — chrony (NTS)
nohook resolv.conf, ntp.conf, timesyncd.conf, hostname, wpa_supplicant
nooption domain_name_servers, domain_name, domain_search, ntp_servers, host_name
# своё имя не отправляем: в этом файле нет опции «hostname»
# Ethernet приоритетнее Wi-Fi (у iwd RoutePriorityOffset=300)
metric 100
# без ARP-проверки конфликта адреса: аренда на 1-2 с быстрее (docs/07)
noarp
