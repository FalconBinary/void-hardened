# void-hardened: iwd — Wi-Fi без wpa_supplicant и NetworkManager (docs/06, docs/07).
# Опции сверены с iwd.config(5) версии 3.12.
[General]
# свой DHCP-клиент iwd, статика — в профиле сети ([IPv4])
EnableNetworkConfiguration=true
# стабильный случайный MAC на каждую сеть; все 6 октетов (без OUI Intel)
AddressRandomization=network
AddressRandomizationRange=full
# PMF, если точка умеет (2 = обязательно — ломает подключение к сетям без PMF)
ManagementFrameProtection=1
RoamThreshold=-70
RoamThreshold5G=-76
DisableANQP=true

[Network]
EnableIPv6=false
# DNS из DHCP игнорируется: резолвер — только локальный unbound
NameResolvingService=none
# Ethernet (dhcpcd, метрика 100) приоритетнее Wi-Fi
RoutePriorityOffset=300

[Scan]
# новая сеть находится быстрее; цена — батарея и эфир (docs/07)
InitialPeriodicScanInterval=3
MaximumPeriodicScanInterval=30

[Rank]
BandModifier5GHz=1.5

[Blacklist]
# после единичного сбоя точка не исключается надолго
InitialTimeout=10
MaximumTimeout=300

[DriverQuirks]
# не пересоздавать интерфейс при старте: быстрее и не теряются настройки wlan0
DefaultInterface=iwlwifi
# энергосбережение Wi-Fi выключено всегда (профиль «скорость сети»)
PowerSaveDisable=iwlwifi
