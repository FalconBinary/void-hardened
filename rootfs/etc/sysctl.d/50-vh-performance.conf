# void-hardened: память, запись на диск, планировщик (docs/11, docs/15). Защиту не ослабляет.
# Сверено с настройками CachyOS: взято всё, что не открывает новых путей атаки.

# --- swap в zram (сжатая RAM, без диска)
vm.swappiness = 180                      # zram дешевле, чем перечитывать файлы с диска
vm.page-cluster = 0                      # zram: читать по одной странице, без упреждения
# --- давление памяти: kswapd начинает раньше и плавнее — меньше рывков
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# кэш имён файлов и inode держится дольше: быстрее поиск и сборка, git status, ls
vm.vfs_cache_pressure = 50
# --- грязные страницы: не больше 256 МБ, фоновая запись с 64 МБ. Копирование на
# флешку и распаковка не забивают RAM гигабайтами несброшенных данных (система не
# «замирает» на sync), а открытого текста недавно записанных файлов в RAM меньше.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# --- планировщик CPU
kernel.sched_autogroup_enabled = 1       # фоновая нагрузка из терминала не отнимает CPU у UI
