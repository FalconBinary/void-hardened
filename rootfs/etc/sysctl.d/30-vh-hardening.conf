# void-hardened: sysctl защиты. Каждая строка — что закрывает (docs/05-system.md).
# Применяется в стадии 1 runit (08-sysctl.sh). net.* действуют на сетевой namespace,
# в котором применены (здесь — init netns); новые netns получают значения ядра по умолчанию.

# --- утечки адресов ядра и журналов
# адреса ядра в /proc скрыты даже от root
kernel.kptr_restrict = 2
# dmesg только с CAP_SYSLOG
kernel.dmesg_restrict = 1
# на консоль только ошибки
kernel.printk = 3 3 3 3
# максимум upstream; «3» — патч Debian, здесь не действует
kernel.perf_event_paranoid = 2

# --- сокращение поверхности атаки ядра
# eBPF только с CAP_BPF; 1 — нельзя вернуть до перезагрузки
kernel.unprivileged_bpf_disabled = 1
# константы в JIT-коде BPF ослеплены (против JIT spraying)
net.core.bpf_jit_harden = 2
# нельзя загрузить другое ядро в обход Secure Boot
kernel.kexec_load_disabled = 1
# ptrace только с CAP_SYS_PTRACE (3 — запрет всем, docs/05)
kernel.yama.ptrace_scope = 2
# io_uring выключен: частый источник LPE
kernel.io_uring_disabled = 2
# userfaultfd — инструмент гонок в эксплойтах
vm.unprivileged_userfaultfd = 0
# магические клавиши SysRq с клавиатуры выключены
kernel.sysrq = 0
# из userns нельзя загружать политики AppArmor
kernel.unprivileged_userns_apparmor_policy = 0
# редкие line discipline не грузятся по запросу
dev.tty.ldisc_autoload = 0
# TIOCSTI (вставка в чужой терминал) запрещён
dev.tty.legacy_tiocsti = 0
# MPTCP встроен и доступен без привилегий
net.mptcp.enabled = 0
# memfd без MFD_NOEXEC_SEAL получают его; MFD_EXEC — отказ
vm.memfd_noexec = 2

# --- рандомизация адресного пространства
kernel.randomize_va_space = 2
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# --- файловые системы: ссылки и файлы в общих каталогах со sticky-битом
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
# в upstream по умолчанию 0
fs.protected_fifos = 2
# в upstream по умолчанию 0
fs.protected_regular = 2

# --- дампы памяти (могут содержать ключи и пароли)
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# --- паника и oops
# дублирует panic=10 из cmdline: перезагрузка, а не зависание
kernel.panic = 10
# брутфорс через множество oops упирается в лимит
kernel.oops_limit = 100
# зависание без паники (soft/hard lockup) тоже ведёт к перезагрузке через прошивку
# (MOR стирает RAM), а не оставляет машину под питанием с ключом LUKS в памяти.
# Детектор hard lockup работает от NMI-сторожа (kernel.nmi_watchdog=1 — умолчание ядра
# Void; nowatchdog и nmi_watchdog=0 запрещены, docs/11). В VM без PMU его нет.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
