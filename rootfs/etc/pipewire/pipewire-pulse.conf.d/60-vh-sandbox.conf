# void-hardened: отдельный сокет PulseAudio для песочницы браузера (docs/08).
# Клиенты этого сокета получают access=restricted: права им выдаёт WirePlumber
# (wireplumber.conf.d/60-vh-sandbox.conf) — воспроизведение да, микрофон и камера нет.
# Массив server.address заменяется целиком, поэтому «unix:native» перечислен снова.
pulse.properties = {
    server.address = [
        "unix:native"
        { address = "unix:/run/vh-sandbox/pulse" client.access = "restricted" }
    ]
}
