# void-hardened: vh-acpid — крышка и кнопка питания (docs/05, docs/12).
# Крышка закрыта → блокировка экрана сразу; закрыта дольше LID_MIN минут →
# штатное выключение (suspend запрещён). С внешним монитором крышка ничего не делает.
LID_MIN=10
# Кнопка питания: poweroff — штатное выключение; lock — блокировка; ignore — ничего.
# Длинное нажатие (4 с) — аппаратное выключение мимо системы (остаточный риск, docs/05).
POWER_KEY=poweroff
# Сторож простоя (0 — выключен; optional/deadman ставит 15 и 60): блокировка и штатное
# выключение без ФИЗИЧЕСКОГО ввода со встроенных клавиатуры и тачпада. idle-inhibit
# браузера (видео) его не останавливает — компромисс для видео: IDLE_LOCK_MIN.
IDLE_LOCK_MIN=0
IDLE_POWEROFF_MIN=0
# Встроенная клавиатура на внутреннем USB (не MSI GF63 — там i8042): подстрока пути
# sysfs устройства, например "/usb1/1-8/" (см. 00-probe.sh, раздел «Устройства ввода»).
INTERNAL_INPUT=""
