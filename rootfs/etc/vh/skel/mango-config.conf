# Конфиг mango повседневного пользователя (void-hardened).
# 1) штатные настройки пакета (раскладка, анимации, базовые привязки)
source=/etc/mango/config.conf
# 2) настройки защиты и привязки void-hardened (файл root, docs/08)
source=/etc/vh/mango-vh.conf
# 3) свои настройки — ниже. Они перекрывают строки выше (последнее значение
#    выигрывает), поэтому не возвращайте focus_on_activate и
#    allow_shortcuts_inhibit без причины.
xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle
