# foot (терминал) — void-hardened (docs/05). Недоверенный текст в терминале.
[main]
font=monospace:size=11

[url]
# ссылки открываются только вручную (Ctrl+Shift+O) и не запускаются, а копируются
# в буфер обмена — вставьте их в браузер сами
launch=wl-copy ${url}

[desktop-notifications]
# уведомления программ (OSC 99/777) не запускают никаких команд
command=

[security]
# OSC 52: программа в терминале может положить текст в буфер, но не прочитать его
osc52=copy-enabled
