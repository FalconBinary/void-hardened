# void-hardened: настройки mango, важные для защиты, и привязки клавиш (docs/08, docs/12).
# Подключается из ~/.config/mango/config.conf строкой «source=/etc/vh/mango-vh.conf».
# Файл принадлежит root: правки — через админа.

# --- защита
# окно не может само забрать фокус (кража фокуса при вводе пароля)
focus_on_activate=0
# приложение не может отключить привязки mango (снять «защищённую комбинацию»)
allow_shortcuts_inhibit=0
# окна песочниц (app_id ставит vh-wlfilter, подделать нельзя): без автофокуса,
# на отдельном теге 9, без полноэкранного режима по запросу клиента
windowrule=isopensilent:1,tags:9,appid:^vh-sandbox
windowrule=ignore_maximize:1,appid:^vh-sandbox

# --- автозапуск сеанса
exec-once=pipewire
exec-once=vh-wlfilter
exec-once=netline
exec-once=zbg
# блокировка после 5 минут простоя; мониторы гаснут — через 10
exec-once=swayidle -w timeout 300 'swaylock -f' before-sleep 'swaylock -f'

# --- привязки
bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,zrun
bind=SUPER+SHIFT,d,spawn,zrun run
bind=SUPER,b,spawn,vh-browse trusted
bind=SUPER+SHIFT,b,spawn,vh-browse untrusted
bind=SUPER,w,spawn,zwifi
bind=SUPER+SHIFT,w,spawn,zbt
bind=SUPER,p,spawn,zwall
bind=SUPER,c,spawn,zcal
bind=SUPER,Escape,spawn,zpower
# «защищённая комбинация»: перед вводом пароля в любой экран блокировки нажмите её —
# настоящий swaylock ляжет поверх поддельного окна (docs/08)
bind=SUPER,l,spawn,swaylock -f
bind=SUPER,f,togglefullscreen,
# флешки (optional/usb-auth): подключить только как накопитель / отключить
bind=SUPER,u,spawn,foot -H doas -n /usr/local/sbin/vh-usb attach
bind=SUPER+SHIFT,u,spawn,foot -H doas -n /usr/local/sbin/vh-usb detach
bind=NONE,XF86MonBrightnessUp,spawn,vh-backlight +5
bind=NONE,XF86MonBrightnessDown,spawn,vh-backlight -5
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
